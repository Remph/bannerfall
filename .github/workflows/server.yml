# The server's tests and code style.
# Pull requests and integration branches are not checked here: Actions minutes on private
# repositories are limited, so the checks run where the change is made. A push to main runs the
# checks once after the merge (path-filtered), and "Run workflow" runs them by hand.
name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', 'web/src/api/openapi.json', '.github/workflows/server.yml']
  workflow_dispatch:

# A newer run for the same branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    # Runs on a push to main (path-filtered) and by hand; pull requests aren't run here to save the
    # limited Actions minutes of a private repository.
    runs-on: ubuntu-latest
    # A normal run takes about 6 minutes; a hanging test should not use up the month's minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # the MIT-licensed cache; the default one is a closed component
      - run: ./gradlew check # runs the tests (Testcontainers works on GitHub runners) and spotlessCheck
