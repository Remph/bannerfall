# The web app's checks. The server (server.yml) and the production image (docker.yml) have their
# own workflows.
# Pull requests and integration branches are not checked here: Actions minutes on private
# repositories are limited, so the checks run where the change is made. A push to main runs the
# checks once after the merge (path-filtered), and "Run workflow" runs them by hand.
name: Web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/ci.yml']
  workflow_dispatch:

# A newer run for the same branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # Runs on a push to main (path-filtered) and by hand; pull requests aren't run here to save the
    # limited Actions minutes of a private repository.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # the API types match src/api/openapi.json (the server job's OpenApiSnapshotTest checks that
      # the copy matches the server)
      - run: pnpm check:api
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
