# The web app's checks. The server (server.yml) and the production image (docker.yml) have their
# own workflows.
# Pull requests and integration branches are not checked here for now: Actions minutes on private
# repositories are limited, so the checks run where the change is made, and all of them run once
# more before a release (by hand: "Run workflow" in the Actions tab, or locally).
name: Web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/ci.yml']
  workflow_dispatch:

# A newer run for the same branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # In a private repository a push to main is skipped to save the limited Actions minutes. Pull
    # requests aren't run here either, so nothing re-checks a merge by itself: the checks run by hand
    # on the branch, and "Run workflow" checks main. A public repository gets its releases as pushes
    # to main and tests them.
    if: github.event_name != 'push' || github.ref_name != 'main' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # the API types match src/api/openapi.json (the server job's OpenApiSnapshotTest checks that
      # the copy matches the server)
      - run: pnpm check:api
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
