# NPC balance: general numbers and the difficulties EASY, NORMAL, HARD (docs/plan/09-npc-lords.md §8, §9).
# CUSTOM lives in world_settings.npc_custom.
npc:
  balance:
    think-jitter: 0.25
    ledger-decay: 0.99
    intel-max-age-hours: 6        # ÷ speed
    farm-margin: 3.0
    farm-max-loss: 0.25
    attack-max-loss: 0.5
    farm-cooldown-minutes: 720    # ÷ speed
    farms-per-round: 3
    noble-troop-share: 0.2
    support-horizon-hours: 3      # ÷ speed
    grudge-hours: 48              # ÷ speed
    guild-radius: 15              # fields: lords this close form guilds (09 §13.1)
    quiet-from: "23:00"
    quiet-to: "07:00"
    quiet-zone: Europe/Berlin
    learning:                     # learning lords (09 §15), world setting npcLearningEnabled; hours are REAL hours
      max-shift: 0.35             # the most of a mix the lessons may move
      half-life-hours: 24         # attacks seen and human wins count half after a real day
      evidence: 5                 # this many attacks (or wins) are full evidence
      window-hours: 72            # human wins older than this are not read
      scout-share: 0.15           # scouts' part of the defence lesson when the lord is only scouted
      wall-step: 3                # a siege attack: wall goal = wall left + this
      wall-hours: 48              # a wall goal lasts this long after the latest siege attack
    # farm-loot-share (v1.3, 09 §6.2): farming stops while the loot of the last 24 real hours is at least this share
    # of the lord's own daily production; 0 = no limit. farm-rest: no farms or raids in the build quiet hours either.
    difficulties:                 # CUSTOM is not here: it lives in world_settings.npc_custom (§8)
      EASY:   { production-factor: 0.7, boost-below: 0.0, boost-factor: 1.0,  lead-margin: 1.0,  attacks-per-player-per-day: 2, attacks-per-human-per-day: 3,  quiet-hours: true,  spare-last-village: true,  build-quiet-from: "22:00", build-quiet-to: "08:00", farm-loot-share: 0.25, farm-rest: true }
      NORMAL: { production-factor: 0.9, boost-below: 0.5, boost-factor: 1.25, lead-margin: 1.25, attacks-per-player-per-day: 4, attacks-per-human-per-day: 8,  quiet-hours: true,  spare-last-village: true,  build-quiet-from: "23:00", build-quiet-to: "07:00", farm-loot-share: 0.75, farm-rest: true }
      HARD:   { production-factor: 1.1, boost-below: 0.6, boost-factor: 1.5,  lead-margin: 1.6,  attacks-per-player-per-day: 8, attacks-per-human-per-day: 16, quiet-hours: false, spare-last-village: false, build-quiet-from: "00:00", build-quiet-to: "06:00", farm-loot-share: 1.0, farm-rest: false }
