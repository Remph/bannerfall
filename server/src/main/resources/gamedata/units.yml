# Unit numbers: docs/plan/02-game-rules.md §5.1 (the rulebook wins if they ever disagree).
# minutes-per-field = walking speed, base-seconds = recruit time per unit at level 1 of its building (speed 1).
# levels (M30, 02-game-rules §5.4) = the research steps above level 1, only used when the world turns unit levels on:
# the first entry is level 2, the second level 3. The stats are whole numbers (about +10 % and +20 % of the base
# stats, never the same twice in a row); cost = 20x and 50x the unit's recruit cost; base-seconds = research time at
# Smithy level 1 and world speed 1 (12 h and 30 h; the smithy level and the speed shorten it); requires = what the
# village that researches needs besides the unit's own requirements (Smithy 10 for level 2, Smithy 15 for level 3).
# A unit without a levels list has no levels (ram, catapult, noble, paladin); the scout has level 2 only.
