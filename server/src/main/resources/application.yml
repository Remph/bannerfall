spring:
  application:
    name: bannerfall
  config:
    # Game numbers (buildings, units, NPC lords) live in their own files; see docs/plan/01-architecture.md §4.2.
    import: classpath:gamedata/buildings.yml,classpath:gamedata/units.yml,classpath:gamedata/achievements.yml,classpath:gamedata/banners.yml,classpath:gamedata/npc/offensive.yml,classpath:gamedata/npc/balanced.yml,classpath:gamedata/npc/defensive.yml,classpath:gamedata/npc/balance.yml
  jackson:
    deserialization:
      # 1.5 as a unit count is refused instead of cut to 1 (M14e, 01 §4.12).
      accept-float-as-int: false
  datasource:
    # Local default = the database from compose.yaml (DB_PORT as there). Production overrides this (application-prod.yml).
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/bannerfall
    username: bannerfall
    password: bannerfall
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Lazy villages/players in lists (troops, movements) load in batches instead of one by one.
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true

server:
  servlet:
    session:
      # A visit without a login (a login through the account server on its way, a join page
      # waiting for the invite code) lasts minutes; a login gets bannerfall.login-session.
      timeout: 15m
      cookie:
        max-age: 30d
        same-site: lax

springdoc:
  # Set explicitly (production switches both off in application-prod.yml): left at their default,
  # springdoc warns at every start, and that WARN would land in server.err.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # Swagger UI sends the XSRF-TOKEN cookie back as X-XSRF-TOKEN header, so POST/PATCH work there
    # (call GET /api/auth/csrf once first). Swagger is switched off in production (application-prod.yml).
    csrf:
      enabled: true

bannerfall:
  admin:
    # The host token for the CLI bannerfall-admin (docs/plan/08-host-console.md §4): env
    # BANNERFALL_ADMIN_TOKEN, at least 32 characters (`openssl rand -base64 32`). Empty = no token door.
    token: ${BANNERFALL_ADMIN_TOKEN:}
  operator:
    # Who runs this world, shown on the privacy page (/privacy, GET /api/world/operator): env
    # BANNERFALL_OPERATOR_NAME (a name, possibly with a postal address) and BANNERFALL_OPERATOR_CONTACT
    # (usually an email address). Empty = the page shows only what the game stores.
    name: ${BANNERFALL_OPERATOR_NAME:}
    contact: ${BANNERFALL_OPERATOR_CONTACT:}
  # Friends play over days: a login lasts 30 days without use (sessions are in memory, a restart
  # logs everyone out; LoginService).
  login-session: 30d
  account-server:
    # Logging in through an account server (an OpenID Connect provider; docs/hosting.md, "Account
    # server"). Env BANNERFALL_ACCOUNT_SERVER_ISSUER (its address, exactly as it names itself),
    # _CLIENT_ID and _CLIENT_SECRET (this world as a client there), _NAME (the login button says
    # "Log in with <name>"; default the issuer's host) and _MODE: OFF (only this world's own
    # accounts, the default), LINKING (both; players may link their account) or REQUIRED (only the
    # account server). Without an issuer the world has only its own accounts.
    issuer: ${BANNERFALL_ACCOUNT_SERVER_ISSUER:}
    client-id: ${BANNERFALL_ACCOUNT_SERVER_CLIENT_ID:}
    client-secret: ${BANNERFALL_ACCOUNT_SERVER_CLIENT_SECRET:}
    name: ${BANNERFALL_ACCOUNT_SERVER_NAME:}
    mode: ${BANNERFALL_ACCOUNT_SERVER_MODE:OFF}
    # BANNERFALL_ACCOUNT_SERVER_CAREER=true: tell the account server, every few minutes, how the
    # players who log in through it are doing here (points, achievements, the end result), for
    # their career page there. Only Bannerfall's own account server takes these reports.
    career: ${BANNERFALL_ACCOUNT_SERVER_CAREER:false}
    career-interval: ${BANNERFALL_ACCOUNT_SERVER_CAREER_INTERVAL:PT5M}
  push:
    # Web Push (1.5, docs/hosting.md "Push notifications"): the world's VAPID key pair, env
    # BANNERFALL_PUSH_PUBLIC_KEY and BANNERFALL_PUSH_PRIVATE_KEY (`bannerfall-admin push keys`
    # prints a new pair). Both empty = no push; only one, or a broken one, stops the start.
    public-key: ${BANNERFALL_PUSH_PUBLIC_KEY:}
    private-key: ${BANNERFALL_PUSH_PRIVATE_KEY:}
    # How the push services can reach the host (mailto: or https): env BANNERFALL_PUSH_SUBJECT.
    # Empty = the operator contact (bannerfall.operator.contact) if it is an e-mail address.
    subject: ${BANNERFALL_PUSH_SUBJECT:}
    # The only addresses the server sends pushes to: the push services of Chrome and Android
    # (also Edge's older versions, Samsung, Opera), Firefox, Safari and Windows. A leading *. allows
    # any subdomain.
    services: https://fcm.googleapis.com, https://updates.push.services.mozilla.com, https://*.push.apple.com, https://*.notify.windows.com
  abuse:
    # Abuse protection (docs/plan/01-architecture.md §4.12). Every number is a default; the host may change it here.
    write-limit:
      # Writes (POST/PUT/PATCH/DELETE on /api/**) per account: this many per second on average ...
      per-second: 10
      # ... with bursts up to this many; beyond it the answer is 429 TOO_MANY_REQUESTS.
      burst: 30
    auto-lock:
      # Locks an account for a while when it piles up suspicion events (audited as AUTO_LOCK). Admins are exempt.
      enabled: true
      events: 20
      window: 10m
      duration: 1h
  status:
    # Sites that may read GET /api/world/status from another origin (M19): the landing page shows the player counts
    # of every world. Comma-separated; env BANNERFALL_STATUS_ORIGINS. Empty = same origin only.
    allowed-origins: ${BANNERFALL_STATUS_ORIGINS:https://bannerfall.de,https://www.bannerfall.de}
  cheats:
    # The host cheats /api/admin/cheats/** (08 §3): env BANNERFALL_CHEATS_ENABLED. application-dev.yml
    # switches them on; the dev cheats /api/dev/** depend on the profile dev instead.
    enabled: ${BANNERFALL_CHEATS_ENABLED:false}
  events:
    # The event worker (tick every 200 ms) and the nightly cleanup. Tests switch it off and call
    # EventProcessor.processDue by hand (docs/plan/01-architecture.md §4.6).
    scheduler-enabled: true
  market:
    # Trading with the market itself (docs/plan/02-game-rules.md §12.1): the daily amounts start again
    # at midnight in this time zone.
    day-zone: Europe/Berlin
  logging:
    # Where server.log and server.err go (logback-spring.xml). Relative to the working directory:
    # server/logs with bootRun. Production: /app/logs (application-prod.yml).
    dir: logs

logging:
  level:
    # Spring logs a 405 (wrong HTTP method) at WARN under this name. It is a normal client error
    # answer (400/404/409 aren't logged either), so it stays out of server.err.
    org.springframework.web.servlet.PageNotFound: error

management:
  endpoints:
    web:
      exposure:
        include: health
